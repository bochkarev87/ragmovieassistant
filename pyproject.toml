[project]
name = "rag-movies"
version = "0.1.0"
description = "RAG ассистент по фильмам"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "scikit-learn>=1.3.0",
    "pytest>=7.4.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]